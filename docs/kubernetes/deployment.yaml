apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-unifi-bouncer-pro
  namespace: crowdsec
  labels:
    app: cs-unifi-bouncer-pro
spec:
  # IMPORTANT: Must be exactly 1. bbolt does not support concurrent writers.
  # Use Recreate strategy so the old pod is fully terminated before the new one
  # starts, preventing two instances from opening the same database file.
  replicas: 1
  strategy:
    type: Recreate
  # /readyz stays unready until the first LAPI pull is processed, which takes
  # several minutes on a ban list of ~100k decisions.
  progressDeadlineSeconds: 1200
  selector:
    matchLabels:
      app: cs-unifi-bouncer-pro
  template:
    metadata:
      labels:
        app: cs-unifi-bouncer-pro
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # The bouncer does not talk to the Kubernetes API; do not hand it a token.
      automountServiceAccountToken: false
      containers:
        - name: cs-unifi-bouncer-pro
          # Pin to a specific release tag. Using 'latest' is not recommended in production
          # as it makes rollbacks and auditing difficult.
          image: developingchet/cs-unifi-bouncer-pro:2.3.0
          args: ["run"]
          env:
            - name: DATA_DIR
              value: /data
            # Credentials are read from files mounted from the Secret, so they
            # are not part of the container environment.
            - name: UNIFI_API_KEY_FILE
              value: /run/secrets/cs-unifi-bouncer-pro/UNIFI_API_KEY
            - name: UNIFI_USERNAME_FILE
              value: /run/secrets/cs-unifi-bouncer-pro/UNIFI_USERNAME
            - name: UNIFI_PASSWORD_FILE
              value: /run/secrets/cs-unifi-bouncer-pro/UNIFI_PASSWORD
            - name: CROWDSEC_LAPI_KEY_FILE
              value: /run/secrets/cs-unifi-bouncer-pro/CROWDSEC_LAPI_KEY
          # Non-secret settings. Add further settings to the ConfigMap in
          # secret.example.yaml.
          envFrom:
            - configMapRef:
                name: cs-unifi-bouncer-pro
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          # Opening a large ban database and logging in to the controller
          # happen before the health server starts; allow up to 5 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # A periodic resync decodes the whole LAPI decision list into
          # memory, accepting a response of up to 64 MiB and 500k decisions.
          # A list near those caps can decode to around 200 MiB on top of the
          # ban database, so keep the limit at 512Mi or more for large lists.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /run/secrets/cs-unifi-bouncer-pro
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cs-unifi-bouncer-pro-data
        - name: credentials
          secret:
            secretName: cs-unifi-bouncer-pro
            # Readable by the pod's fsGroup only.
            defaultMode: 0440
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
