apiVersion: v1
kind: Secret
metadata:
  name: cs-unifi-bouncer-pro
  namespace: crowdsec
type: Opaque
# The Deployment mounts each key as a file and points the matching *_FILE
# setting at it, so all four keys must be present. Leave a value empty when it
# is not used: use ONE of the API key or the username and password.
stringData:
  UNIFI_API_KEY: ""
  UNIFI_USERNAME: "bouncer"
  UNIFI_PASSWORD: "changeme"
  CROWDSEC_LAPI_KEY: "changeme"
---
# Non-secret settings, passed to the container as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cs-unifi-bouncer-pro
  namespace: crowdsec
data:
  UNIFI_URL: "https://192.168.1.1"
  UNIFI_VERIFY_TLS: "true"
  # For a self-signed controller certificate, mount its CA and set UNIFI_CA_CERT.

  CROWDSEC_LAPI_URL: "https://crowdsec-service:8080"

  # Firewall configuration
  UNIFI_SITES: "default"
  FIREWALL_MODE: "auto"
  ZONE_PAIRS: "External->Dmz"
