version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - nilerr
  exclusions:
    rules:
      - text: 'Error return value of .*Close.* is not checked'
        linters:
          - errcheck
      - text: 'Error return value of .*(Write|WriteString).* is not checked'
        linters:
          - errcheck
      - text: 'Error return value of `fmt\.Fprint.*` is not checked'
        linters:
          - errcheck
