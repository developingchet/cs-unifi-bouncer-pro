name: Bouncer / CrowdSec Integration Issue
description: Issues specific to the CrowdSec engine, LAPI connection, or bouncer behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a usage question, see [SUPPORT.md](https://github.com/developingchet/cs-unifi-bouncer-pro/blob/main/SUPPORT.md).

        Do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/developingchet/cs-unifi-bouncer-pro/security/advisories/new).

  - type: input
    id: crowdsec-version
    attributes:
      label: CrowdSec version
      placeholder: "e.g. 1.6.2"
    validations:
      required: true

  - type: dropdown
    id: firewall-mode
    attributes:
      label: Firewall mode
      options:
        - auto
        - zone
        - legacy
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: Include LAPI errors, decision sync issues, or ban behavior problems
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config (sanitized)
      description: Paste relevant bouncer config after removing API keys and credentials
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
    validations:
      required: false
