name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - name: Verify module checksums
        run: go mod verify
      - name: Test source
        run: go test ./...
      - name: Vet source
        run: go vet ./...
      - name: Check for known vulnerabilities
        run: go run -modfile=.github/tools/go.mod golang.org/x/vuln/cmd/govulncheck ./...

  build-binaries:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
    runs-on: ubuntu-latest
    needs: [verify]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: cs-unifi-bouncer-pro-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: cs-unifi-bouncer-pro-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            artifact: cs-unifi-bouncer-pro-linux-armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build \
            -ldflags="-s -w \
              -X main.Version=${RELEASE_TAG} \
              -X main.Commit=${{ github.sha }} \
              -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -trimpath \
            -o "${{ matrix.artifact }}" \
            ./cmd/bouncer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  docker-scan:
    name: Docker Scan
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image for scanning (linux/amd64 only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local:scan
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local:scan
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.69.2
          format: table

      - name: Trivy SARIF scan (non-blocking, for Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        if: always()
        with:
          image-ref: local:scan
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.69.2
          format: sarif
          output: trivy-results.sarif
          skip-setup-trivy: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker-scan]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # cosign 3 publishes signatures and attestations in the new bundle
          # format as OCI referrers, which older cosign clients following the
          # verify instructions in the docs do not find.
          cosign-release: v2.6.5

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: developingchet/cs-unifi-bouncer-pro
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: developingchet/cs-unifi-bouncer-pro:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (CycloneDX)
        timeout-minutes: 10
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0
        with:
          image: developingchet/cs-unifi-bouncer-pro@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: cs-unifi-bouncer-pro.sbom.cyclonedx.json

      - name: Sign image with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            developingchet/cs-unifi-bouncer-pro@${{ steps.build.outputs.digest }}

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate cs-unifi-bouncer-pro.sbom.cyclonedx.json \
            --type cyclonedx \
            developingchet/cs-unifi-bouncer-pro@${{ steps.build.outputs.digest }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: cs-unifi-bouncer-pro.sbom.cyclonedx.json
          if-no-files-found: error

      - name: Publish release tags
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" \
            developingchet/cs-unifi-bouncer-pro@${{ steps.build.outputs.digest }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: developingchet/cs-unifi-bouncer-pro
          readme-filepath: ./DOCKERHUB.md

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker-push]
    permissions:
      contents: write
      id-token: write  # cosign keyless signing of the release files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Only the binaries: build-push-action also uploads build records as artifacts,
          # and everything in dist/ goes into checksums.txt.
          pattern: cs-unifi-bouncer-pro-linux-*
          path: dist/
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-cyclonedx
          path: dist/

      - name: Generate checksums
        working-directory: dist/
        run: sha256sum * > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.6.5  # same client as the image signing in docker-push

      # checksums.txt covers every binary and the SBOM, so one signature
      # authenticates all release files.
      - name: Sign the checksums
        working-directory: dist/
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v2
        with:
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull developingchet/cs-unifi-bouncer-pro:${{ github.ref_name }}
            ```

            Multi-arch image (linux/amd64, linux/arm64, linux/arm/v7) published to Docker Hub.

            ## Supply-chain verification

            This image is signed with [Cosign](https://docs.sigstore.dev/cosign/overview/) (keyless OIDC):

            ```bash
            cosign verify developingchet/cs-unifi-bouncer-pro:${{ github.ref_name }} \
              --certificate-identity-regexp="https://github.com/developingchet/cs-unifi-bouncer-pro/.github/workflows/release.yml@refs/tags/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
            ```

            A CycloneDX SBOM is attached to this release and embedded as a Cosign attestation on the image.

            The release files are covered by `checksums.txt`, which is signed with Cosign:

            ```bash
            cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp="https://github.com/developingchet/cs-unifi-bouncer-pro/.github/workflows/release.yml@refs/tags/.*" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
            sha256sum --ignore-missing -c checksums.txt
            ```
          files: |
            dist/cs-unifi-bouncer-pro-linux-amd64
            dist/cs-unifi-bouncer-pro-linux-arm64
            dist/cs-unifi-bouncer-pro-linux-armv7
            dist/cs-unifi-bouncer-pro.sbom.cyclonedx.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
