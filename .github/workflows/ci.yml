name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # default for all jobs — no write access needed

jobs:
  test:
    name: Go Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race detector)
        run: go test -race ./... -count=1 -timeout=120s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

  validate-seccomp:
    name: Validate Seccomp Profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: sudo apt-get install -y --no-install-recommends jq

      - name: Validate syscall allowlist
        run: bash scripts/validate-seccomp.sh ./security/seccomp-unifi.json

  # A controller connection error is expected; a seccomp startup failure is not.
  test-seccomp:
    name: Seccomp Integration Test
    runs-on: ubuntu-latest
    needs: validate-seccomp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cs-unifi-bouncer-test:ci
          build-args: |
            VERSION=ci-seccomp-test
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z

      - name: Run bouncer version under seccomp profile
        run: |
          docker run --rm \
            --security-opt "seccomp:./security/seccomp-unifi.json" \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            cs-unifi-bouncer-test:ci \
            version

      - name: Test seccomp profile allows storage open
        run: |
          DATA_DIR=$(mktemp -d)
          chmod 777 "$DATA_DIR"
          set +e
          OUTPUT=$(docker run --rm \
            --security-opt "seccomp:./security/seccomp-unifi.json" \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -v "$DATA_DIR":/data \
            -e DRY_RUN=false \
            -e CROWDSEC_LAPI_KEY=test \
            -e UNIFI_URL=https://192.0.2.1 \
            -e UNIFI_API_KEY=test \
            -e UNIFI_HTTP_TIMEOUT=5s \
            cs-unifi-bouncer-test:ci reconcile 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          # reconcile will fail to connect (expected) but must not fail with EPERM
          # A seccomp violation exits 159 (SIGSYS); connection failure exits 1.
          if [ "$EXIT" -eq 159 ] || echo "$OUTPUT" | grep -Eiq 'operation not permitted|seccomp'; then
            echo "FAIL: seccomp blocked a required syscall (exit 159 = SIGSYS)"
            exit 1
          fi
          if [ "$EXIT" -ne 1 ]; then
            echo "FAIL: expected controller connection failure (exit 1), got $EXIT"
            exit 1
          fi
          test -s "$DATA_DIR/bouncer.db"
          echo "OK: storage opened and controller connection failed as expected"
